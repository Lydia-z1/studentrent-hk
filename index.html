const narrative={
methodTitle:['演示数据与推荐方法','示範數據與推薦方法','Mock data & recommendation method'],methodNote:['本原型不是实时房源平台。地理底图来自 Esri，14 个候选区域为近似位置。租金、通勤和五类设施指数均为人工构造的演示数据；连锁品牌与分店未验证。','本原型不是即時房源平台。地理底圖來自 Esri，14 個候選區域為近似位置。租金、通勤和五類設施指數均為人工構造的示範數據；連鎖品牌與分店未驗證。','This is not a live property platform. Esri supplies the geographic basemap; 14 candidate areas use approximate coordinates. Rent, commute and five amenity indices are synthetic. Chain brands and branches have not been verified.'],methodH1:['01　先筛选，再排序','01　先篩選，再排序','01 Filter, then rank'],methodP1:['按最近一次应用的大学、月租上限和通勤上限筛选；通勤滑杆范围为 5–90 分钟。覆盖 8 所大学目的校区，并非香港全部高等院校。','按最近一次套用的大學、月租上限和通勤上限篩選；通勤滑桿範圍為 5–90 分鐘。涵蓋 8 所大學目的校區，並非香港全部高等院校。','Areas are filtered using the last applied university, rent limit and commute limit. The commute slider spans 5–90 minutes. Eight university campuses are included, not all Hong Kong institutions.'],methodH2:['02　可解释的加权评分','02　可解釋的加權評分','02 Explainable weighted scoring'],methodP2:['租金得分 = 100 ×（预算 − 月租）÷ 预算；通勤得分 = 100 ×（上限 − 时间）÷ 上限；设施得分为已选类别的演示指数平均值。未选设施时，设施分统一为 100。综合分为三项按权重加权平均并四舍五入；至少一项权重须大于 0。','租金得分 = 100 ×（預算 − 月租）÷ 預算；通勤得分 = 100 ×（上限 − 時間）÷ 上限；設施得分為已選類別的示範指數平均值。未選設施時，設施分統一為 100。綜合分為三項按權重加權平均並四捨五入；至少一項權重須大於 0。','Rent score = 100 × (budget − rent) / budget. Commute score = 100 × (limit − time) / limit. Amenity score is the average mock index for selected categories, or 100 when none is selected. Overall score is the rounded weighted average. At least one weight must be positive.'],methodH3:['03　图层开关与分析偏好独立','03　圖層開關與分析偏好獨立','03 Display layers and scoring preferences are separate'],methodP3:['地图面板可分别显示大学、推荐区域、港铁、连锁超市、诊所、连锁健身房和餐厅。图层开关只改变显示，不改变评分；生活设施偏好会在点击探索后更新评分。圆形不是行政边界或通勤服务区，设施图标不是实际 POI。','地圖面板可分別顯示大學、推薦區域、港鐵、連鎖超市、診所、連鎖健身房和餐廳。圖層開關只改變顯示，不改變評分；生活設施偏好會在點擊探索後更新評分。圓形不是行政邊界或通勤服務區，設施圖示不是實際 POI。','Control university, area, MTR, chain supermarket, clinic, chain gym and restaurant layers independently. Layer toggles affect display only; amenity preferences affect scoring after you apply them. Circles are not boundaries or commute service areas. Amenity icons are not real POIs.'],methodH4:['04　后续数据连接','04　後續數據連接','04 Future data integration'],methodP4:['公开 Web Map 可直接连接，自带图层可独立开关。正式版需要租金与设施 Feature Layer，以及网络分析或服务区结果。本原型未执行交通路由、3D 步行网络或社区安全排名。不同语言仅切换本应用文字；外部底图、Web Map 图层名和用户自写内容不自动翻译。','公開 Web Map 可直接連接，自帶圖層可獨立開關。正式版需要租金與設施 Feature Layer，以及網絡分析或服務區結果。本原型未執行交通路由、3D 步行網絡或社區安全排名。不同語言僅切換本應用文字；外部底圖、Web Map 圖層名稱和使用者自寫內容不會自動翻譯。','Public Web Maps can be connected and their layers toggled independently. Production requires rent and amenity Feature Layers plus network or service-area results. This prototype does not compute routes, 3D walking networks or neighbourhood safety rankings. Language switching covers app text; external map labels, Web Map layer names and user-written content are not translated.'],methodH5:['记录与隐私','記錄與隱私','Records & privacy'],methodP5:['检查清单、照片及备注仅保存在当前浏览器，不上传，没有账号同步。请自行备份；清理浏览器可能丢失数据。没有自动遮盖个人资料或法律证据认证功能。','檢查清單、照片及備註僅儲存於目前瀏覽器，不上傳，沒有帳戶同步。請自行備份；清理瀏覽器可能遺失數據。沒有自動遮蓋個人資料或法律證據認證功能。','Checklists, photos and notes stay in this browser with no upload or account sync. Keep your own backups; clearing browser data may erase them. There is no automatic personal-data redaction or legal evidence certification.']};Object.assign(messages,narrative);

function rankAreas(query, campusIndex) {
  const candidates = importedRentals.length ? importedAreas(query) : demoAreas.filter(a => a.rent <= query.budget && a.times[campusIndex] <= query.minutes);
  const ordered = candidates.map(area => {
    const time = area.time ?? area.times[campusIndex];
    const preferenceValues = query.prefs.map(key => area.poi[facilityKeys.indexOf(key)]).filter(Number.isFinite);
    const fs = preferenceValues.length ? preferenceValues.reduce((x, y) => x + y, 0) / preferenceValues.length : importedRentals.length ? null : 100;
    const rs = Math.max(0, 100 * (1 - area.rent / query.budget));
    const ts = Math.max(0, 100 * (1 - time / query.minutes));
    const [rentWeight, timeWeight, requestedFacilityWeight] = query.weights;
    const facilityWeight = fs === null ? 0 : requestedFacilityWeight;
    const denominator = rentWeight + timeWeight + facilityWeight;
    const score = denominator ? Math.round((rs * rentWeight + ts * timeWeight + (fs ?? 0) * facilityWeight) / denominator) : 0;
    return {...area, time, fs, rs, ts, score};
  }).sort((a, b) => b.score - a.score || a.rent - b.rent);
  if (importedRentals.length) areas.splice(0, areas.length, ...ordered);
  return ordered;

    const scope=r=>/^(single room|shared room|room)$/i.test(r.type)?'room':'entire_unit';
    const rows=area.rows.filter(r=>(listingTypeFilter==='all'||scope(r)===listingTypeFilter)&&(!listingBudgetOnly||r.rent<=applied.budget)).toSorted((a,b)=>a.rent-b.rent);
    $('modalBody').querySelectorAll('.rental-content').forEach((card,i)=>card.insertAdjacentHTML('beforeend',selectControl('csv:'+rows[i].id)));
  };
  const baseOpenListings = openListings;
  openListings = function(...args) {
    baseOpenListings(...args);
    if(modalKind==='listings'){
      $('modalBody').insertAdjacentHTML('afterbegin',tray()+`<p class="rental-compare-help">${t('rentalChoose')}</p>`);
      bindControls();
    }
  };
  const baseOpenDetail=openListingDetail;
  openListingDetail=function(id){
    baseOpenDetail(id);
    if(modalKind==='listingDetail'){
      $('modalBody').insertAdjacentHTML('afterbegin',tray()+selectControl('sample:'+id));
      bindControls();
    }
  };
  function renderComparisonTable() {
    let rentals=candidates().filter(r=>selected.has(r.key)).map(r=>({...r,scores:score(r)}));
    rentals.sort((a,b)=>sortBy==='rent'?a.rent-b.rent:sortBy==='commute'?a.minutes-b.minutes:(b.scores.total??-1)-(a.scores.total??-1)||a.rent-b.rent);
    const rows = [
      ['rentalRank',(_,i)=>'#'+(i+1)], ['rentalMonthly',r=>'HK$ '+fmt(r.rent)],
      ['rentalCommute',r=>number(r.minutes)], ['rentalScore',r=>number(r.scores.total)],
      ['rentalRentScore',r=>number(r.scores.rent)], ['rentalTimeScore',r=>number(r.scores.commute)],
      ['rentalFacilityScore',r=>number(r.scores.amenities)], ['rentalArea',r=>esc(r.area)],
      ['rentalCampus',r=>esc(localized(uniNames[r.campus]))], ['rentalType',r=>esc(r.type)],
      ['rentalSize',r=>number(r.size)],
      ...facilityKeys.map((key,i)=>[key,r=>!Number.isFinite(r.facilities[i])?t('rentalUnknown'):r.mock?number(r.facilities[i])+' / 100':t(r.facilities[i]===100?'rentalYes':'rentalNo')]),
      ['rentalSource',r=>r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${t('original')} ↗</a>`:t('rentalNoSource')]
    ];
    $('rentalComparisonTable').innerHTML=`<div class="rental-comparison-scroll" role="region" aria-label="${t('rentalCompare')}" tabindex="0"><table class="rental-comparison-table"><thead><tr><th scope="col">${t('rentalCompare')}</th>${rentals.map(r=>`<th scope="col">${esc(r.name)}<small>${esc(r.id)}</small><button class="listing-back" data-rental-remove="${esc(r.key)}">${t('rentalRemove')}</button></th>`).join('')}</tr></thead><tbody>${rows.map(([key,render])=>`<tr${key==='rentalScore'?' class="rental-score-row"':''}><th scope="row">${t(key)}</th>${rentals.map((r,i)=>`<td>${render(r,i)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    $('modalBody').querySelectorAll('[data-rental-remove]').forEach(button=>button.onclick=()=>{selected.delete(button.dataset.rentalRemove);openRentalComparison();});
    const sum=weights.reduce((a,b)=>a+b,0);
    $('rentalWeightSummary').textContent=sum?t('rentalWeightSummary',{a:number(100*weights[0]/sum),b:number(100*weights[1]/sum),c:number(100*weights[2]/sum)}):t('rentalZero');
    $('rentalMockNote').textContent=t(rentals.some(r=>r.mock)?'rentalMockNote':'rentalMissingNote');
  }
  function openRentalComparison() {
    const available=new Set(candidates().map(r=>r.key));
    for(const key of selected)if(!available.has(key))selected.delete(key);
    updateCounts();
    if(selected.size<2){
      const rentals=candidates().filter(r=>selected.has(r.key));
      modal(t('rentalCompare'),`<p class="notice">${t('rentalChoose')}</p>${rentals.map(r=>`<p>${esc(r.name)} · HK$ ${fmt(r.rent)}</p>`).join('')}<button class="outline" id="rentalChooseMore">${t('rentalBack')}</button>`,'rentalCompare');
      $('rentalChooseMore').onclick=()=>{if(listingAreaId&&results.some(a=>a.id===listingAreaId))openListings(listingAreaId);else if(results.length)openListings(results[0].id,true);else $('modal').close();};
      return;
    }
    modal(t('rentalCompare'),`<div class="rental-compare-actions"><button class="outline" id="rentalChooseMore">${t('rentalBack')}</button><button class="outline" id="rentalClearAll">${t('rentalClear')}</button><span>${t('rentalSelected',{n:selected.size})}</span></div><p class="rental-compare-help">${t('rentalContext',{rent:fmt(applied.budget),minutes:applied.minutes})}</p><fieldset class="rental-weight-panel"><legend>${t('rentalWeights')}</legend><div class="rental-presets">${presets.map((p,i)=>`<button class="outline" data-rental-preset="${i}">${t(presetKeys[i])} ${p.join('/')}</button>`).join('')}</div>${['rent','time','poi'].map((key,i)=>`<label>${t(key)}<input type="range" min="0" max="100" step="1" value="${weights[i]}" data-rental-weight="${i}"><output>${weights[i]}</output></label>`).join('')}<p id="rentalWeightSummary" role="status"></p><p class="rental-compare-help">${t('rentalWeightHint')}</p></fieldset><label class="rental-sort">${t('rentalSort')} <select id="rentalCompareSort"><option value="score">${t('rentalScore')}</option><option value="rent">${t('rentalMonthly')}</option><option value="commute">${t('rentalCommute')}</option></select></label><p class="rental-compare-help">${t('rentalSwipe')}</p><div id="rentalComparisonTable"></div><p class="notice" id="rentalMockNote"></p><p class="rental-compare-help">${t('rentalScoreNote')}</p>`,'rentalCompare');
    $('rentalChooseMore').onclick=()=>openListings(listingAreaId||results[0].id);
    $('rentalClearAll').onclick=()=>{selected.clear();openRentalComparison();};
    $('rentalCompareSort').value=sortBy;
    $('rentalCompareSort').onchange=e=>{sortBy=e.target.value;renderComparisonTable();};
    $('modalBody').querySelectorAll('[data-rental-weight]').forEach(input=>input.oninput=()=>{weights[+input.dataset.rentalWeight]=+input.value;input.nextElementSibling.textContent=input.value;renderComparisonTable();});
    $('modalBody').querySelectorAll('[data-rental-preset]').forEach(button=>button.onclick=()=>{
      weights=[...presets[+button.dataset.rentalPreset]];
      $('modalBody').querySelectorAll('[data-rental-weight]').forEach(input=>{input.value=weights[+input.dataset.rentalWeight];input.nextElementSibling.textContent=input.value;});
      renderComparisonTable();
    });
    renderComparisonTable();
  }
  const baseRestore=restoreListingDialog;
  restoreListingDialog=function(){if(modalKind==='rentalCompare')openRentalComparison();else baseRestore();};
  const baseRender=renderStatic;
  renderStatic=function(...args){baseRender(...args);updateCounts();};
  const baseApply=applyFilters;
  applyFilters=function(...args){
    const oldCampus=applied?.uni,oldWeights=applied?.weights.join(',');
    baseApply(...args);
    if(oldCampus&&oldCampus!==applied.uni&&selected.size){selected.clear();toast(t('rentalContextReset'));}
    if(oldWeights!==applied.weights.join(',')){
      const sum=applied.weights.reduce((a,b)=>a+b,0);
      weights=applied.weights.map(v=>Math.round(v/sum*100));
    }
    updateCounts();
  };
  const baseSwitch=switchData;
  switchData=function(...args){selected.clear();baseSwitch(...args);updateCounts();};
  updateCounts();
  if(new URLSearchParams(location.search).get('view')==='rentals')openRentalComparison();
  else if(['listings','listingDetail'].includes(modalKind))restoreListingDialog();
})();

</script></body></html>
